name: Deploy Studio Flows
run-name: Deploy Studio Flows to ${{ inputs.ENVIRONMENT }}

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: Environment to deploy to
        default: Develop
        type: choice
        options:
          - Develop
          - Production

      OVERWRITE_MANUAL:
        description: Overwrite manual changes made to Studio flows
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

env:
  TWILIO_API_KEY: ${{ vars[format('{0}_TWILIO_API_KEY', inputs.ENVIRONMENT)] }}
  TWILIO_API_SECRET: ${{ secrets[format('{0}_TWILIO_API_SECRET', inputs.ENVIRONMENT)] }}

jobs:
  deploy_studio:
    if: inputs.ENVIRONMENT == 'Develop' || github.triggering_actor == 'zing-devops'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            twilio/studio

      - name: Validate Studio Flows
        uses: zingdevlimited/studio-flow-actions/validate@v1
        with:
          CONFIG_PATH: twilio/studio/studio-flows.config.json
          VALIDATE_PREVIOUS_REVISION_USER: ${{ !inputs.OVERWRITE_MANUAL }}
          TWILIO_API_KEY: ${{ env.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ env.TWILIO_API_SECRET }}

      - name: Deploy Studio Flows
        uses: zingdevlimited/studio-flow-actions/deploy@v1
        with:
          CONFIG_PATH: twilio/studio/studio-flows.config.json
          TWILIO_API_KEY: ${{ env.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ env.TWILIO_API_SECRET }}
        env:
          API_BASE_URL: ${{ vars[format('{0}_BASE_URL', inputs.ENVIRONMENT)] }}
